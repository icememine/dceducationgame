<title>Rồng DC Academy Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: staff console. Left rail = role-filtered menu; main column = one task per page. Same tokens as the learner app (theme D light, C dark). */
:root {
  --page: #F3F5F9; --surface: #FFFFFF; --sunken: #EEF1F6;
  --ink: #0E1421; --muted: #5F6B80; --line: #E3E8F0; --line-strong: #C5CDDA;
  --jade: #0B8A66; --jade-deep: #086A4F; --jade-soft: #DDF5EC;
  --gold: #9A6206; --gold-soft: #FFF4DC;
  --coral: #C4323E; --coral-deep: #A02430; --coral-soft: #FCE7E8;
  --sky: #1D64B4; --sky-deep: #165094; --sky-soft: #E1EDFA;
  --primary: #0E1421; --on-primary: #FFFFFF; --on-accent: #FFFFFF;
  --hero: #0E1421; --hero-ink: #EEF2F8; --hero-muted: #8C97AB; --hero-accent: #4FD1A5;
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0E1421; --surface: #161D2D; --sunken: #1C2435;
  --ink: #EEF2F8; --muted: #8C97AB; --line: #24304A; --line-strong: #3A4760;
  --jade: #4FD1A5; --jade-deep: #7BE0BF; --jade-soft: #163A31;
  --gold: #E8B04B; --gold-soft: #2A2416;
  --coral: #F06E76; --coral-deep: #F5969B; --coral-soft: #3A1A1E;
  --sky: #60A5EB; --sky-deep: #8CBEF5; --sky-soft: #16283E;
  --primary: #4FD1A5; --on-primary: #0E1421; --on-accent: #0E1421;
  --hero: #1B2A3A; --hero-ink: #EEF2F8; --hero-muted: #8C97AB; --hero-accent: #4FD1A5;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0E1421; --surface: #161D2D; --sunken: #1C2435;
  --ink: #EEF2F8; --muted: #8C97AB; --line: #24304A; --line-strong: #3A4760;
  --jade: #4FD1A5; --jade-deep: #7BE0BF; --jade-soft: #163A31;
  --gold: #E8B04B; --gold-soft: #2A2416;
  --coral: #F06E76; --coral-deep: #F5969B; --coral-soft: #3A1A1E;
  --sky: #60A5EB; --sky-deep: #8CBEF5; --sky-soft: #16283E;
  --primary: #4FD1A5; --on-primary: #0E1421; --on-accent: #0E1421;
  --hero: #1B2A3A; --hero-ink: #EEF2F8; --hero-muted: #8C97AB; --hero-accent: #4FD1A5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--sky-deep); }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Prototype strip */
.proto { background: var(--hero); color: var(--hero-ink); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 12.5px; }
.proto b { color: var(--hero-accent); letter-spacing: .08em; font-size: 11px; }
.proto .seg { display: inline-flex; border: 1px solid #3A4760; border-radius: 999px; overflow: hidden; }
.proto .seg button { background: transparent; border: 0; padding: 5px 12px; cursor: pointer; color: var(--hero-muted); font-weight: 600; }
.proto .seg button[aria-pressed="true"] { background: var(--hero-accent); color: #0E1421; }
.proto .sp { flex: 1; }
.proto .lnk { background: none; border: 0; color: var(--hero-ink); text-decoration: underline; cursor: pointer; padding: 4px 0; }

/* Shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100% - 40px); }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - 40px); overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--hero); color: var(--hero-accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.brand div { display: flex; flex-direction: column; line-height: 1.25; }
.brand strong { font-size: 14px; }
.brand span { color: var(--muted); font-size: 12px; }
.navlabel { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; text-transform: uppercase; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 600; }
.nav:hover { background: var(--sunken); }
.nav[aria-current="page"] { background: var(--jade-soft); color: var(--jade-deep); }
.nav .count { font-size: 11.5px; font-weight: 700; background: var(--coral-soft); color: var(--coral-deep); border-radius: 999px; padding: 1px 8px; }
.nav.later { color: var(--muted); font-weight: 500; }
.nav.later::after { content: "Chưa xây"; flex: none; white-space: nowrap; font-size: 10.5px; border: 1px dashed var(--line-strong); border-radius: 999px; padding: 0 6px; }
.me { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.me a { text-decoration: none; font-weight: 700; color: var(--ink); }
.me span { color: var(--muted); font-size: 12px; }
.me button { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; }

main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-inline: 12px; }
.crumb { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 800; }
.lede { color: var(--muted); max-width: 72ch; margin: 0; }

/* Mobile: rail becomes a top strip */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); gap: 4px; }
  .brand, .navlabel, .me, .nav.later { display: none; }
  .nav { white-space: nowrap; }
  .wrap { padding-inline: 0; }
}

/* Parts */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.tile { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); }
.tile:hover { border-color: var(--line-strong); }
.tile .t { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tile p { margin: 0; color: var(--muted); font-size: 13px; }
.big { font-size: 28px; font-weight: 800; line-height: 1; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pill.bad { background: var(--coral-soft); color: var(--coral-deep); }
.pill.ok { background: var(--jade-soft); color: var(--jade-deep); }
.pill.warn { background: var(--gold-soft); color: var(--gold); }
.pill.info { background: var(--sky-soft); color: var(--sky-deep); }
.pill.quiet { background: var(--sunken); color: var(--muted); }
.note { border-radius: 12px; padding: 12px 14px; font-size: 13px; }
.note.warn { background: var(--gold-soft); }
.note.bad { background: var(--coral-soft); color: var(--coral-deep); }
.note.ok { background: var(--jade-soft); color: var(--jade-deep); }
.note.info { background: var(--sky-soft); color: var(--sky-deep); }
.note p { margin: 0; }
.note ul { margin: 4px 0 0; padding-left: 18px; }

.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.field.grow { flex: 1; min-width: 180px; }
.in { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; font-weight: 500; color: var(--ink); min-width: 0; width: 100%; }
textarea.in { resize: vertical; line-height: 1.5; }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 13.5px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.jade { background: var(--jade); color: var(--on-accent); }
.btn.coral { background: var(--coral); color: var(--on-accent); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line-strong); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.linkbtn { background: none; border: 0; color: var(--sky-deep); font-weight: 700; cursor: pointer; padding: 4px 0; text-decoration: underline; }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tablewrap table { min-width: 720px; }
th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .03em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunken); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.r { text-align: right; }
.sub { display: block; color: var(--muted); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
.bar { height: 6px; background: var(--sunken); border-radius: 999px; overflow: hidden; margin-top: 6px; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--jade); border-radius: 999px; }
.bar i.low { background: var(--coral); }

.item { display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); }
.q { margin: 0; font-size: 14px; }
.ans { white-space: pre-wrap; background: var(--sunken); border-radius: 10px; padding: 12px; margin: 0; font-size: 13.5px; }
details > summary { cursor: pointer; font-weight: 700; color: var(--sky-deep); font-size: 13px; list-style: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
.inner { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.review { background: var(--sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.radios { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 600; }
.radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hist { margin: 0; padding: 0; list-style: none; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.hist li { color: var(--muted); }
.hist b { color: var(--ink); }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.trail .step { background: var(--sunken); border-radius: 8px; padding: 4px 9px; }
.trail .step b { display: block; font-size: 10.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.trail .arrow { color: var(--muted); }
.trail .final { background: var(--jade-soft); color: var(--jade-deep); font-weight: 700; }

/* Editor */
.editor { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .editor { grid-template-columns: minmax(0, 1fr); } }
.picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .picker { grid-template-columns: minmax(0, 1fr); } }
.flabel { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; margin-bottom: 4px; }
.flabel span { font-weight: 500; color: var(--muted); font-size: 12px; }
.flabel span.bad { color: var(--coral-deep); font-weight: 700; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.opt input[type="radio"] { margin-top: 11px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.phone { position: sticky; top: 16px; border: 1px solid var(--line); border-radius: 28px; background: var(--page); padding: 18px 16px 20px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.phone .ctx { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13px; color: var(--muted); }
.phone .ctx b { display: block; font-size: 11px; letter-spacing: .08em; color: var(--jade-deep); margin-bottom: 4px; }
.phone h3 { font-size: 17px; font-weight: 800; line-height: 1.35; }
.phone .choice { border: 1px solid var(--line-strong); border-radius: 12px; padding: 11px 12px; background: var(--surface); font-weight: 600; font-size: 13.5px; }
.phone .choice.right { border: 2px solid var(--jade); background: var(--jade-soft); }
.phone .insight { background: var(--hero); color: var(--hero-ink); border-radius: 14px; padding: 12px; font-size: 13px; }
.phone .insight b { color: var(--hero-accent); display: block; font-size: 11px; letter-spacing: .08em; margin-bottom: 4px; }
.diff { font-family: var(--mono); font-size: 12px; background: var(--sunken); border-radius: 10px; padding: 10px; overflow-x: auto; margin: 0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.diff .add { background: var(--jade-soft); display: block; }
.diff .del { background: var(--coral-soft); display: block; }
.diff .hunk { color: var(--sky-deep); display: block; }

.otp { background: var(--gold-soft); border-radius: 12px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.otp code { font-family: var(--mono); font-size: 16px; font-weight: 600; background: var(--surface); border-radius: 8px; padding: 4px 10px; align-self: flex-start; }

/* Login */
.login { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.login .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; padding: 28px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--hero); color: var(--hero-ink); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(14, 20, 33, .25); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>

<div class="proto" role="region" aria-label="Điều khiển bản mẫu">
  <b>BẢN MẪU</b>
  <span>Xem với vai trò</span>
  <span class="seg" id="roleSeg">
    <button data-role="admin" aria-pressed="true">Quản trị</button>
    <button data-role="content" aria-pressed="false">Nội dung</button>
    <button data-role="compliance" aria-pressed="false">Tuân thủ</button>
  </span>
  <span class="sp"></span>
  <span>Số liệu mẫu, không phải dữ liệu thật</span>
  <button class="lnk" id="themeBtn">Đổi giao diện sáng/tối</button>
</div>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- Policy (mirrors src/features/staff/roles.ts) ---------- */
  var ROLES = {
    admin: { label: "Quản trị", description: "Toàn quyền, quản lý tài khoản nhân viên" },

  };
  var PERM = {

    audit: ["admin", "compliance"], staff: ["admin"]
  };
  var NAV = [
    { id: "analytics", label: "Phân tích câu hỏi", perm: "analytics" },
    { id: "editor", label: "Trình soạn thảo", perm: "editor" },
    { id: "ai-review", label: "Duyệt câu trả lời AI", perm: "ai-review" },
    { id: "risk-audit", label: "Kiểm tra hồ sơ rủi ro", perm: "risk-audit" },
    { id: "market-sim", label: "Mô phỏng thị trường giảm", perm: "market-sim" },
    { id: "audit", label: "Nhật ký", perm: "audit" },
    { id: "staff", label: "Tài khoản nhân viên", perm: "staff" }
  ];
  var LATER = [
    { id: "later-learners", label: "Tra cứu học viên", text: "Tìm một học viên theo tên hiển thị hoặc mã DragonX để trả lời yêu cầu hỗ trợ. Chỉ xem, không sửa." },
    { id: "later-notify", label: "Thông báo & MoEngage", text: "Xem sự kiện Academy đã gửi sang MoEngage và số người nhận theo từng chiến dịch. Soạn chiến dịch vẫn làm trong MoEngage." },
    { id: "later-sso", label: "Đăng nhập một lần (SSO)", text: "Nhân viên đăng nhập bằng tài khoản công ty (OIDC) và xác thực hai lớp, thay cho mật khẩu riêng của Academy." }

    review: "Duyệt", "content-edit": "Tạo bản sửa nội dung", "market-sim": "Gửi mô phỏng thị trường giảm", export: "Tải CSV"
  };
  var OUTCOMES = { ok: "Đạt", issue: "Cần sửa", escalated: "Chuyển cấp trên" };
  var STATUS = { todo: "Chưa duyệt", ok: "Đạt", issue: "Cần sửa", escalated: "Chuyển cấp trên", all: "Tất cả" };
  var AI_FLAGS = {
    promise: "Có thể hứa hẹn lợi nhuận", "asks-secret": "Có thể hỏi OTP/PIN/mật khẩu",
    "source-line": "Có dòng \"Nguồn:\" (đã tự xoá trước khi hiển thị)", "faq-number": "Nhắc số câu FAQ nội bộ"
  };
  var RISK_VIEWS = {

    "first-time-high-risk": "Nhà đầu tư lần đầu với hồ sơ Khá mạo hiểm hoặc Rất mạo hiểm",
    "short-horizon-high-tolerance": "Thời gian đầu tư dưới 3 năm nhưng khả năng chấp nhận rủi ro cao",
    inconsistency: "Câu trả lời có dấu hiệu mâu thuẫn",
    "low-capacity-high-risk": "Năng lực tài chính thấp nhưng muốn đầu tư mạo hiểm",
    "chose-higher": "Chọn hồ sơ cao hơn kết quả đánh giá (đã xác nhận)",
    confirmed: "Đã xác nhận", unconfirmed: "Chưa xác nhận", all: "Tất cả"
  };
  var can = function (role, p) { return PERM[p].indexOf(role) >= 0; };

  /* ---------- Sample data ---------- */
  var SEGMENTS = [

    if (/chắc chắn lãi|cam kết lợi nhuận|không bao giờ lỗ/i.test(d.options.join(" ") + d.explain)) issues.push({ path: "explain", msg: "Có cụm từ hứa hẹn lợi nhuận, Compliance không duyệt" });

  });
  document.getElementById("themeBtn").addEventListener("click", function () {
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
